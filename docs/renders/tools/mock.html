<script>/*THEME_JS*/</script>
<script>
 if(q.get("h"))PureBlackSky.setHour(+q.get("h"));
 PureBlackSky.setWeather(W);
 (()=>{const w=window.PureBlackWater,t=+(q.get("t")||0);
  let info={w:W};
  if(w&&q.has("bar")){w.stop();w.canvas.remove();}
  if(w&&t){w.stop();w.advance(t);w.render();
   const c=document.createElement("canvas");c.width=w.canvas.width;c.height=w.canvas.height;c.style.cssText=w.canvas.style.cssText;c.id=w.canvas.id;
   c.getContext("2d").drawImage(w.canvas,0,0);w.canvas.replaceWith(c);info={...info,...w.stats};}
